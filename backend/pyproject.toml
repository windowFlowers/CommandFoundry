[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiscopilot-backend"
version = "2.10.0"
description = "Local-first developer command RAG backend for AegisCopilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "rank-bm25>=0.2.2,<1",
  "fastembed>=0.7,<1",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
  "openai>=1.63,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
desktop = ["pyinstaller>=6.10,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
