name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run repository guard
        run: python scripts/check_placeholder_corruption.py

      - name: Validate offline evaluation fixtures
        run: python scripts/validate_evaluation_data.py

      - name: Run v2.11 offline golden evaluation
        run: python scripts/run_evaluation.py --suite core --mode offline --output "${{ runner.temp }}/commandfoundry-evaluation.json"

      - name: Verify offline report identity and hard gates
        run: python scripts/check_release_evaluation.py "${{ runner.temp }}/commandfoundry-evaluation.json"

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Build frontend
        working-directory: frontend
        run: npm run build
